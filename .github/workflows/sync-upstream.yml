name: Sync upstream & deploy

# 1) 定时从上游主线（OpenListTeam/OpenList-Worker）拉取更新，自动合并到 main。
# 2) 有更新时自动重新部署 Cloudflare Worker（openlist），
#    Secrets（JWT_SECRET / ENCRYPTION_SECRET）与 D1 绑定不受部署影响。
#
# 本仓库为上游镜像，正常情况应始终与上游一致，直接快进即可。
# 若本地曾改过构建产物（cloud-functions/[[default]].js 等单行压缩 bundle），
# git 无法三方合并，此时统一采用上游版本；其余真实源码冲突仍然报错等待人工处理。
#
# 本仓库的 .github/workflows/** 由 fork 自己维护，同步时一律保留本地版本：
# GITHUB_TOKEN 是 GitHub App 身份，推送任何改动工作流文件的提交都会被服务端拒绝
# （remote rejected: refusing to allow a GitHub App to create or update workflow），
# 上游一旦改自己的工作流，本任务就会整体失败。

on:
  schedule:
    - cron: "0 4 * * *" # UTC 04:00 = 北京时间 12:00
  workflow_dispatch:
    inputs:
      deploy:
        description: "强制重新部署 Cloudflare Worker（无更新时也部署）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          set -e
          PRE=$(git rev-parse HEAD)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/OpenListTeam/OpenList-Worker.git
          git fetch upstream --tags --prune
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已是最新，无需同步。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            # 构建产物（单行压缩 bundle）无法三方合并，统一采用上游结果。
            # 注意"上游已删除该文件"（modify/delete）这种冲突里上游那一版根本不存在，
            # checkout --theirs 会报 "does not have their version" 并让 set -e 直接炸掉整步，
            # 所以必须先判断上游版本在不在，不在就跟着删。
            has_theirs() { git ls-files -u -- "$1" | awk '{print substr($1,1,1)}' | grep -qx 3; }
            while IFS= read -r -d '' f; do
              case "$f" in
                cloud-functions/*|dist/*)
                  if has_theirs "$f"; then
                    echo "构建产物冲突，采用上游版本：$f"
                    git checkout --theirs -- "$f"
                    git add -A -- "$f"
                  else
                    echo "构建产物已被上游删除，跟随删除：$f"
                    git rm -q --ignore-unmatch -- "$f"
                  fi
                  ;;
                .github/workflows/*)
                  # 本仓库自有 CI 配置：无论上游是改、增还是删，一律以本地版本为准。
                  # 注意此处只是解决冲突，真正的还原在合并提交生成之后（见下方 amend）。
                  echo "工作流文件冲突，保留本仓库版本：$f"
                  git checkout "$PRE" -- "$f" 2>/dev/null || git rm -q --ignore-unmatch -- "$f"
                  git add -A -- "$f"
                  ;;
                *)
                  echo "::error::合并上游时发生冲突（$f），请手动解决后再推送。"
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only -z --diff-filter=U)
            git commit --no-edit
          fi
          # 合并可能带进上游对工作流文件的改动，这类提交用 GITHUB_TOKEN 推不上去。
          # 必须改写（amend）刚生成的合并提交，而不是另起一个"改回去"的提交——
          # 后者本身也在改动工作流文件，同样会被拒绝。
          if ! git diff --quiet "$PRE" HEAD -- .github/workflows; then
            echo "还原上游对工作流的改动（保留本仓库自有 CI 配置）："
            git diff --name-status "$PRE" HEAD -- .github/workflows
            git rm -r -q --cached -- .github/workflows
            rm -rf .github/workflows
            git checkout "$PRE" -- .github/workflows
            git add -A -- .github/workflows
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.deploy
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fetch official frontend dist
        run: node scripts/fetch-frontend.mjs

      - name: Write wrangler config
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "openlist",
            "main": "src/backend/worker.ts",
            "compatibility_date": "2026-08-04",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "preview_urls": false,

            "assets": {
              "directory": "./dist",
              "binding": "ASSETS"
            },

            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "openlist",
                "database_id": "3dedac0d-cac4-41e5-9aae-14f4efdc1894"
              }
            ],

            "vars": {
              "ENVIRONMENT": "production",
              "DB_FORMAT": "sql",
              "DB_DRIVER": "d1"
            }
          }
          EOF

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 1
        run: pnpm exec wrangler deploy --keep-vars
